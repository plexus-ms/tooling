---
# The ingress VM: holds a public IPv4 address, routes inbound TCP to the
# tenant VMs on an internal bridge, and is their gateway and NAT for outbound
# traffic. It terminates nothing: 443 is routed by TLS SNI and 80 by the Host
# header, so every tenant VM keeps its own Caddy and certificates (PLX-Ingress).
# List plexus.host.firewall after this role: the rules below
# are a fragment of the host firewall.
haproxy_public_interface: eth0
haproxy_internal_interface: eth1
haproxy_internal_network: 10.10.0.0/24

# Tenant VMs behind the ingress: the host names that reach each one, and
# optionally a public port forwarded to the VM's SSH (the deploy verb, § 6 PLX-Delivery).
#   - name: host-a
#     address: 10.10.0.11
#     hosts: [example.org, www.example.org]
#     ssh_port: 2101
haproxy_backends: []
# Ports this role opens on the ingress VM, besides the forwarded SSH ports.
# SSH to the VM itself is the host firewall's (firewall_public_tcp).
haproxy_public_tcp: [80, 443]
