---
- name: Proxmox users for the admins
  ansible.builtin.import_tasks: users.yml

# ── web UI on the overlay only ──────────────────────────────────────────────
# Facts are re-read here because the play's own fact gathering may predate the
# interface (a first run joins NetBird in the same play).
- name: Read network facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - network

- name: Fail when the listen interface has no IPv4 address
  ansible.builtin.assert:
    that: ansible_facts[proxmox_listen_interface].ipv4.address is defined
    fail_msg: >-
      Interface {{ proxmox_listen_interface }} has no IPv4 address;
      run the netbird role first or set proxmox_listen_interface.

# pveproxy binds to the overlay address, which does not exist yet when pveproxy
# starts at boot; this lets it bind before the interface is up.
- name: Allow binding to an address that is not up yet
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_file: /etc/sysctl.d/90-pveproxy-nonlocal-bind.conf
    state: present

- name: Bind the web UI and SPICE proxy to the listen interface's address
  ansible.builtin.copy:
    dest: /etc/default/pveproxy
    owner: root
    group: root
    mode: "0644"
    content: |
      # Web UI (8006) and SPICE proxy (3128) listen on the NetBird address only.
      LISTEN_IP="{{ ansible_facts[proxmox_listen_interface].ipv4.address }}"
  notify: Restart pveproxy and spiceproxy

# ── public listeners Proxmox brings along ───────────────────────────────────
# Postfix (Proxmox brings it along) is bound to loopback by mail.
# rpcbind (port 111) is only needed for NFS storage.
- name: Stop and disable rpcbind
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - rpcbind.socket
    - rpcbind.service

# ── needrestart ─────────────────────────────────────────────────────────────
# needrestart (upgrades) restarts every service that
# runs on an upgraded library, the whole Proxmox stack included. pmxcfs does
# not stop within its timeout, is killed, and the PVE daemons' stop scripts
# fail without it: one failure mail per daemon, everything back after a few
# seconds. The cluster filesystem and corosync keep running on the old
# library until the supervised reboot; the daemons on top restart fine.
- name: Keep needrestart off the cluster filesystem and corosync
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/20-proxmox.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Written by the plexus.infrastructure collection (proxmox).
      # Never restart pmxcfs or corosync for a library upgrade: pmxcfs hangs on
      # stop and takes the PVE daemons' stop scripts down with it.
      $nrconf{override_rc}{qr(^(pve-cluster|corosync))} = 0;

# ── subscription notice ─────────────────────────────────────────────────────
- name: Suppress the subscription notice
  ansible.builtin.include_tasks: subscription_notice.yml
  when: proxmox_suppress_subscription_notice

# ── storage ─────────────────────────────────────────────────────────────────
- name: Set ZFS pool properties
  community.general.zfs:
    name: "{{ proxmox_zfs_pool }}"
    state: present
    extra_zfs_properties:
      compression: "on"   # lz4; datasets inherit it
      atime: "off"        # no metadata write per read

- name: Read the pool's autotrim setting
  ansible.builtin.command:
    cmd: zpool get -H -o value autotrim {{ proxmox_zfs_pool }}
  register: proxmox_autotrim
  changed_when: false
  check_mode: false

- name: Enable autotrim on the pool
  ansible.builtin.command:
    cmd: zpool set autotrim=on {{ proxmox_zfs_pool }}
  when: proxmox_autotrim.stdout != 'on'
  changed_when: true

# Mounted (the pool itself is not) because container root disks are datasets
# under it, which Proxmox expects to find mounted below their parent.
- name: Create the dataset for guest disks
  community.general.zfs:
    name: "{{ proxmox_zfs_vm_dataset }}"
    state: present
    extra_zfs_properties:
      mountpoint: /{{ proxmox_zfs_vm_dataset }}

- name: Read the Proxmox storage configuration
  ansible.builtin.command:
    cmd: pvesh get /storage --output-format json
  register: proxmox_storages
  changed_when: false
  check_mode: false

- name: Register the dataset as zfspool storage
  ansible.builtin.command:
    cmd: >-
      pvesm add zfspool {{ proxmox_zfs_vm_storage }}
      --pool {{ proxmox_zfs_vm_dataset }} --content images,rootdir --sparse 1
  when: proxmox_zfs_vm_storage not in (proxmox_storages.stdout | from_json | map(attribute='storage'))
  changed_when: true

- name: Limit the dir storage to file content
  ansible.builtin.command:
    cmd: pvesm set local --content {{ proxmox_dir_storage_content }}
  when: >-
    (proxmox_storages.stdout | from_json | selectattr('storage', 'equalto', 'local') | map(attribute='content') | first | split(',') | sort)
    != (proxmox_dir_storage_content | split(',') | sort)
  changed_when: true

- name: Cap the ZFS ARC at boot
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # ZFS read cache: {{ proxmox_zfs_arc_max_gib }} GiB, the rest of the RAM is for guests.
      options zfs zfs_arc_max={{ proxmox_zfs_arc_max_gib * 1024 * 1024 * 1024 }}
  notify: Update initramfs

- name: Read the running ARC cap
  ansible.builtin.command:
    cmd: cat /sys/module/zfs/parameters/zfs_arc_max
  register: proxmox_arc_max
  changed_when: false
  check_mode: false

- name: Cap the ZFS ARC now
  ansible.builtin.shell:
    cmd: echo {{ proxmox_zfs_arc_max_gib * 1024 * 1024 * 1024 }} > /sys/module/zfs/parameters/zfs_arc_max
  when: proxmox_arc_max.stdout | int != proxmox_zfs_arc_max_gib * 1024 * 1024 * 1024
  changed_when: true

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+\S+\s+swap\s'
    state: absent
  when: not proxmox_swap

- name: Read active swap
  ansible.builtin.command:
    cmd: swapon --noheadings --show=NAME
  register: proxmox_swapon
  changed_when: false
  check_mode: false
  when: not proxmox_swap

- name: Turn swap off
  ansible.builtin.command:
    cmd: swapoff -a
  when:
    - not proxmox_swap
    - proxmox_swapon.stdout | length > 0
  changed_when: true

# ── internal guest bridge ───────────────────────────────────────────────────
# Through Proxmox's own API rather than editing /etc/network/interfaces, which
# Proxmox rewrites; "set" applies the pending change with ifreload.
- name: Read the host's network interfaces
  ansible.builtin.command:
    cmd: pvesh get /nodes/{{ ansible_facts.hostname }}/network --output-format json
  register: proxmox_ifaces
  changed_when: false
  check_mode: false

- name: Create the internal guest bridge
  ansible.builtin.command:
    cmd: >-
      pvesh create /nodes/{{ ansible_facts.hostname }}/network
      --iface {{ proxmox_internal_bridge }} --type bridge --autostart 1
      --comments "internal guest bridge: no host address; the ingress VM is its gateway"
  when: proxmox_internal_bridge not in (proxmox_ifaces.stdout | from_json | map(attribute='iface'))
  changed_when: true
  notify: Apply network changes

# ── firewall ────────────────────────────────────────────────────────────────
# /etc/pve is a FUSE file system that refuses chmod and chown, which makes
# Ansible's file modules fail after writing. The files are therefore staged on
# a normal file system (where check mode and --diff work as usual) and written
# into /etc/pve by plain shell redirection when they differ. pve-firewall picks
# up a change within seconds; no restart is needed.
- name: Create the staging directory
  ansible.builtin.file:
    path: /var/lib/pve-firewall/staged
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Stage the firewall files
  ansible.builtin.copy:
    dest: "/var/lib/pve-firewall/staged/{{ item.name }}"
    owner: root
    group: root
    mode: "0640"
    content: "{{ item.content }}"
  loop:
    - name: cluster.fw
      content: |
        [OPTIONS]

        enable: 1
        policy_in: DROP
        policy_out: ACCEPT

        [ALIASES]

        local_network {{ proxmox_listen.network }}/{{ proxmox_listen.prefix }} # admin access (SSH, web UI, SPICE) only from the overlay

        [RULES]

        IN ACCEPT -i {{ proxmox_listen_interface }} -log nolog # everything from the overlay
        {% for port in proxmox_firewall_public_tcp %}
        IN ACCEPT -p tcp -dport {{ port }} -log nolog
        {% endfor %}
        {% for port in proxmox_firewall_public_udp %}
        IN ACCEPT -p udp -dport {{ port }} -log nolog
        {% endfor %}
        IN Ping(ACCEPT) -log nolog
    - name: host.fw
      content: |
        [OPTIONS]

        enable: 1
  loop_control:
    label: "{{ item.name }}"
  vars:
    proxmox_listen: "{{ ansible_facts[proxmox_listen_interface].ipv4 }}"

- name: Compare the staged files with /etc/pve
  ansible.builtin.command:
    cmd: cmp -s /var/lib/pve-firewall/staged/{{ item.name }} {{ item.dest }}
  loop:
    - { name: cluster.fw, dest: /etc/pve/firewall/cluster.fw }
    - { name: host.fw, dest: "/etc/pve/nodes/{{ ansible_facts.hostname }}/host.fw" }
  loop_control:
    label: "{{ item.dest }}"
  register: proxmox_fw_cmp
  changed_when: false
  failed_when: proxmox_fw_cmp.rc > 2
  check_mode: false

- name: Write the firewall files into /etc/pve
  ansible.builtin.shell:
    cmd: cat /var/lib/pve-firewall/staged/{{ item.item.name }} > {{ item.item.dest }}
  loop: "{{ proxmox_fw_cmp.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: item.rc != 0
  changed_when: true

- name: Check that the rule set compiles
  ansible.builtin.command:
    cmd: pve-firewall compile
  changed_when: false
  register: proxmox_fw_compile
  failed_when: proxmox_fw_compile.rc != 0 or 'error' in proxmox_fw_compile.stderr | lower

# ── guest backups ───────────────────────────────────────────────────────────
- name: Guest backups to Proxmox Backup Server
  when: proxmox_pbs_server | length > 0
  block:
    - name: Fail when the token secret or the encryption key is missing
      ansible.builtin.assert:
        that:
          - proxmox_pbs_token_secret | length > 0
          - (proxmox_pbs_encryption_key | from_json).data is defined
        fail_msg: PBS_TOKEN_SECRET or PBS_ENCRYPTION_KEY did not resolve; run through ./ansible-playbookw.
        quiet: true
      no_log: true

    # Each storage, job and notification resource below is read as JSON first,
    # created when it is missing, and updated when what the host holds differs
    # from the inventory, as in the pbs role. A resource created in this run is
    # not in the read, so it is not updated too. Where a comparison does not
    # match the host's JSON (a field name or value format), correct it in the
    # update task's `when`; each line compares one field.
    #
    # What `pvesh get /storage` shows of a PBS storage, and what the role
    # therefore can and cannot reconcile:
    # - fingerprint, namespace, username, content and prune-backups are shown
    #   and updated with `pvesm set` when they drift.
    # - server and datastore are shown but fixed: `pvesm set` cannot change
    #   them, only removing and re-adding the storage can. The role never
    #   removes a backup storage, so it fails for that host instead.
    # - the encryption key is not shown, only its fingerprint (the key file's
    #   "fingerprint" field, or 1 for a key without one). A different
    #   fingerprint fails the run too: replacing the host's copy of a backup
    #   key is a decision for a person, not a side effect of a playbook run.
    # - the token secret is not shown at all. It is sent along whenever a
    #   visible field drifted; a rotation of the secret alone is applied with
    #   proxmox_pbs_token_rotate: true, for one run.
    - name: Fail when a PBS storage's server, datastore or encryption key differs from the inventory
      vars:
        proxmox_pbs_storage_now: >-
          {{ proxmox_storages.stdout | from_json
          | selectattr('storage', 'equalto', item.id) | list }}
        proxmox_pbs_key_fingerprint: "{{ (proxmox_pbs_encryption_key | from_json).fingerprint | default('1') | string }}"
      ansible.builtin.assert:
        that:
          - proxmox_pbs_storage_now[0].server | default('') == proxmox_pbs_server
          - proxmox_pbs_storage_now[0].datastore | default('') == proxmox_pbs_datastore
          - proxmox_pbs_storage_now[0]['encryption-key'] | default('') | string == proxmox_pbs_key_fingerprint
        fail_msg: >-
          Storage {{ item.id }} on the host has server
          {{ proxmox_pbs_storage_now[0].server | default('(none)') }}, datastore
          {{ proxmox_pbs_storage_now[0].datastore | default('(none)') }} and encryption key
          {{ proxmox_pbs_storage_now[0]['encryption-key'] | default('(none)') }}; the inventory says
          {{ proxmox_pbs_server }}, {{ proxmox_pbs_datastore }} and {{ proxmox_pbs_key_fingerprint }}.
          The role does not change these on an existing storage. If the inventory is right,
          remove the storage on the host by hand (`pvesm remove {{ item.id }}`; the backups
          on the server stay) and run again, which adds it from the inventory.
        quiet: true
      when: proxmox_pbs_storage_now | length > 0
      loop: "{{ proxmox_pbs_storages }}"
      loop_control:
        label: "{{ item.id }}"

    # Proxmox copies the key to /etc/pve/priv/storage/<id>.enc when the storage
    # is added; this file is only the hand-over, on tmpfs, written only when a
    # storage is about to be added and removed again right after.
    - name: Register the missing PBS storages
      vars:
        proxmox_pbs_storages_missing: >-
          {{ proxmox_pbs_storages
          | rejectattr('id', 'in', proxmox_storages.stdout | from_json | map(attribute='storage') | list)
          | list }}
      when: proxmox_pbs_storages_missing | length > 0
      block:
        - name: Hand the encryption key over
          ansible.builtin.copy:
            dest: /run/pbs-encryption-key.json
            owner: root
            group: root
            mode: "0600"
            content: "{{ proxmox_pbs_encryption_key }}"
          no_log: true

        - name: Register the PBS storages
          ansible.builtin.command:
            argv:
              - pvesm
              - add
              - pbs
              - "{{ item.id }}"
              - --server
              - "{{ proxmox_pbs_server }}"
              - --fingerprint
              - "{{ proxmox_pbs_fingerprint }}"
              - --datastore
              - "{{ proxmox_pbs_datastore }}"
              - --namespace
              - "{{ item.namespace }}"
              - --username
              - "{{ proxmox_pbs_token_id }}"
              - --password
              - "{{ proxmox_pbs_token_secret }}"
              - --encryption-key
              - /run/pbs-encryption-key.json
              - --content
              - backup
              - --prune-backups
              - keep-all=1
          changed_when: true
          no_log: true
          loop: "{{ proxmox_pbs_storages_missing }}"
          loop_control:
            label: "{{ item.id }}"

      always:
        - name: Remove the handed-over key
          ansible.builtin.file:
            path: /run/pbs-encryption-key.json
            state: absent

    - name: Update the PBS storages when they drifted
      vars:
        proxmox_pbs_storage_now: >-
          {{ proxmox_storages.stdout | from_json
          | selectattr('storage', 'equalto', item.id) | list }}
      ansible.builtin.command:
        argv:
          - pvesm
          - set
          - "{{ item.id }}"
          - --fingerprint
          - "{{ proxmox_pbs_fingerprint }}"
          - --namespace
          - "{{ item.namespace }}"
          - --username
          - "{{ proxmox_pbs_token_id }}"
          - --password
          - "{{ proxmox_pbs_token_secret }}"
          - --content
          - backup
          - --prune-backups
          - keep-all=1
      when:
        - proxmox_pbs_storage_now | length > 0
        - >-
          proxmox_pbs_token_rotate | bool
          or proxmox_pbs_storage_now[0].fingerprint | default('') | lower != proxmox_pbs_fingerprint | lower
          or proxmox_pbs_storage_now[0].namespace | default('') != item.namespace
          or proxmox_pbs_storage_now[0].username | default('') != proxmox_pbs_token_id
          or proxmox_pbs_storage_now[0].content | default('') | split(',') | sort != ['backup']
          or proxmox_pbs_storage_now[0]['prune-backups'] | default('') != 'keep-all=1'
      changed_when: true
      no_log: true
      loop: "{{ proxmox_pbs_storages }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Read the backup jobs
      ansible.builtin.command:
        cmd: pvesh get /cluster/backup --output-format json
      register: proxmox_backup_jobs_now
      changed_when: false
      check_mode: false

    # Snapshot mode: the guest keeps running and the guest agent freezes its
    # file systems for the moment the backup starts.
    - name: Create the backup jobs
      ansible.builtin.command:
        cmd: >-
          pvesh create /cluster/backup --id {{ item.id }}
          --storage {{ item.storage }} --vmid {{ item.vmids | join(',') }}
          --schedule "{{ item.schedule }}" --mode snapshot --enabled 1
          --notes-template "{{ '{{guestname}}' }}"
      when: item.id not in (proxmox_backup_jobs_now.stdout | from_json | map(attribute='id'))
      changed_when: true
      loop: "{{ proxmox_backup_jobs }}"
      loop_control:
        label: "{{ item.id }}"

    # The API returns a job as /etc/pve/jobs.cfg holds it: vmid is one
    # comma-separated string ("100,101"), schedule the calendar event exactly
    # as written, enabled 1 or 0. The guests are compared as a set, so a
    # reordered list in the inventory is not a change. A job disabled by hand
    # is enabled again.
    - name: Update the backup jobs when they drifted
      vars:
        proxmox_backup_job_now: >-
          {{ proxmox_backup_jobs_now.stdout | from_json
          | selectattr('id', 'equalto', item.id) | list }}
        proxmox_notes_template: "{{ '{{guestname}}' }}"
      ansible.builtin.command:
        cmd: >-
          pvesh set /cluster/backup/{{ item.id }}
          --storage {{ item.storage }} --vmid {{ item.vmids | join(',') }}
          --schedule "{{ item.schedule }}" --mode snapshot --enabled 1
          --notes-template "{{ '{{guestname}}' }}"
      when:
        - proxmox_backup_job_now | length > 0
        - >-
          proxmox_backup_job_now[0].storage | default('') != item.storage
          or proxmox_backup_job_now[0].vmid | default('') | string | split(',') | map('trim') | map('int') | sort
             != item.vmids | map('int') | sort
          or proxmox_backup_job_now[0].schedule | default('') != item.schedule
          or proxmox_backup_job_now[0].mode | default('snapshot') != 'snapshot'
          or not (proxmox_backup_job_now[0].enabled | default(true) | bool)
          or proxmox_backup_job_now[0]['notes-template'] | default('') != proxmox_notes_template
      changed_when: true
      loop: "{{ proxmox_backup_jobs }}"
      loop_control:
        label: "{{ item.id }}"

# ── notifications ───────────────────────────────────────────────────────────
- name: Notifications to a real mailbox
  when: proxmox_alerts_smtp | length > 0
  block:
    - name: Read the SMTP endpoints
      ansible.builtin.command:
        cmd: pvesh get /cluster/notifications/endpoints/smtp --output-format json
      register: proxmox_smtp_endpoints
      changed_when: false
      check_mode: false

    - name: Create the SMTP endpoint
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/notifications/endpoints/smtp
          - --name
          - smtp
          - --server
          - "{{ proxmox_alerts_smtp.server }}"
          - --port
          - "{{ proxmox_alerts_smtp.port }}"
          - --mode
          - "{{ proxmox_alerts_smtp.mode }}"
          - --username
          - "{{ proxmox_alerts_smtp.username }}"
          - --password
          - "{{ proxmox_alerts_smtp.password }}"
          - --from-address
          - "{{ proxmox_alerts_smtp.from_address }}"
          - --mailto
          - "{{ proxmox_alerts_smtp.mailto }}"
      when: "'smtp' not in (proxmox_smtp_endpoints.stdout | from_json | map(attribute='name'))"
      changed_when: true
      no_log: true

    # The API never returns the password, so it rides along whenever a visible
    # field drifted; a rotation of the password alone is applied with
    # `rotate: true` on the dict, for one run. mailto comes back as a list, and
    # a missing mode means Proxmox's default, tls.
    - name: Update the SMTP endpoint when it drifted
      vars:
        proxmox_smtp_current: >-
          {{ proxmox_smtp_endpoints.stdout | from_json
          | selectattr('name', 'equalto', 'smtp') | list }}
      ansible.builtin.command:
        argv:
          - pvesh
          - set
          - /cluster/notifications/endpoints/smtp/smtp
          - --server
          - "{{ proxmox_alerts_smtp.server }}"
          - --port
          - "{{ proxmox_alerts_smtp.port }}"
          - --mode
          - "{{ proxmox_alerts_smtp.mode }}"
          - --username
          - "{{ proxmox_alerts_smtp.username }}"
          - --password
          - "{{ proxmox_alerts_smtp.password }}"
          - --from-address
          - "{{ proxmox_alerts_smtp.from_address }}"
          - --mailto
          - "{{ proxmox_alerts_smtp.mailto }}"
      when:
        - proxmox_smtp_current | length > 0
        - >-
          proxmox_alerts_smtp.rotate | default(false) | bool
          or proxmox_smtp_current[0].server | default('') != proxmox_alerts_smtp.server
          or proxmox_smtp_current[0].port | default(0) | int != proxmox_alerts_smtp.port | int
          or proxmox_smtp_current[0].mode | default('tls') != proxmox_alerts_smtp.mode
          or proxmox_smtp_current[0].username | default('') != proxmox_alerts_smtp.username
          or proxmox_smtp_current[0]['from-address'] | default('') != proxmox_alerts_smtp.from_address
          or proxmox_smtp_current[0].mailto | default([]) | join(',') != proxmox_alerts_smtp.mailto
      changed_when: true
      no_log: true

    # Endpoints and matchers share one namespace, hence the two names.
    - name: Read the matchers
      ansible.builtin.command:
        cmd: pvesh get /cluster/notifications/matchers --output-format json
      register: proxmox_matchers
      changed_when: false
      check_mode: false

    - name: Route warnings and failures to the endpoint
      ansible.builtin.command:
        cmd: >-
          pvesh create /cluster/notifications/matchers --name alerts --target smtp
          --match-severity warning,error,unknown
          --comment "Warnings and failures to the alerts mailbox"
      when: "'alerts' not in (proxmox_matchers.stdout | from_json | map(attribute='name'))"
      changed_when: true

    # target and match-severity come back as lists; the severities given as
    # one comma-separated value are one entry.
    - name: Update the matcher when it drifted
      vars:
        proxmox_matcher: >-
          {{ proxmox_matchers.stdout | from_json
          | selectattr('name', 'equalto', 'alerts') | list }}
      ansible.builtin.command:
        cmd: >-
          pvesh set /cluster/notifications/matchers/alerts --target smtp
          --match-severity warning,error,unknown
          --comment "Warnings and failures to the alerts mailbox"
          --disable 0
      when:
        - proxmox_matcher | length > 0
        - >-
          proxmox_matcher[0].target | default([]) | join(',') != 'smtp'
          or proxmox_matcher[0]['match-severity'] | default([]) | join(',') != 'warning,error,unknown'
          or proxmox_matcher[0].disable | default(false) | bool
      changed_when: true

    - name: Disable the built-in matcher
      ansible.builtin.command:
        cmd: pvesh set /cluster/notifications/matchers/default-matcher --disable 1
      when: >-
        proxmox_matchers.stdout | from_json
        | selectattr('name', 'equalto', 'default-matcher')
        | rejectattr('disable', 'defined')
        | list | length > 0
      changed_when: true
