---
# Rotation closes inside the playbook (§ 2 PLX-Secrets): environment is
# injected at container creation, so a rewritten .env.secret rotates a file,
# not a credential, until the affected containers are re-created. A bare
# `up -d` — the same invocation the deploy verb and a human use, since compose
# reads .env implicitly and the image is pinned in the file — re-creates
# exactly the services whose environment differs. Skipped where the deploy
# verb has not placed a compose file yet, and in check mode, where a new
# deployment's dir does not exist yet and the command would fail on chdir
# before it could skip itself. An app the apps role failed to start is left
# out: the same `up -d` would only fail again, and the playbook reports it.
- name: Re-create app containers for rotated secrets
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ item }}"
  loop: "{{ secrets_dirs | default([]) | difference(apps_failures | default([]) | map(attribute='dir') | list) }}"
  become: true
  become_user: "{{ plexus_deploy_user }}"
  when: plexus_up | bool and not ansible_check_mode
  register: secrets_recreate
  changed_when: "'Recreated' in secrets_recreate.stderr or 'Started' in secrets_recreate.stderr"
  failed_when: (secrets_recreate.rc | default(1)) != 0 and 'no configuration file' not in (secrets_recreate.stderr | default(''))
