---
- name: Remove conflicting distro Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent

# deb822_repository fetches and stores the signing key itself (needs
# python3-debian on the host — base installs it). It does NOT refresh the apt
# cache; the install task below does, via update_cache.
- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg
    state: present

- name: Install Docker engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

# A tenant that needs other daemon-level config (registries, …) overrides
# docker_daemon_json in group_vars; empty leaves the file untouched.
- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_json | to_nice_json }}\n"
    mode: "0644"
  when: docker_daemon_json | length > 0
  notify: Restart docker

- name: Let unattended-upgrades upgrade Docker
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/53-unattended-upgrades-docker
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "site=download.docker.com";
      };
  when: docker_unattended_upgrades

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Remove the images no container uses, daily
  when: docker_image_prune
  block:
    - name: Install the image prune script
      ansible.builtin.copy:
        src: docker-image-prune
        dest: /usr/local/sbin/docker-image-prune
        owner: root
        group: root
        mode: "0755"

    - name: Install the image prune service
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker-image-prune.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Remove the Docker images no container uses
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/docker-image-prune
      notify: Reload systemd

    - name: Install the image prune timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker-image-prune.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Remove the Docker images no container uses

          [Timer]
          OnCalendar=daily
          RandomizedDelaySec=1h
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable the image prune timer
      ansible.builtin.systemd_service:
        name: docker-image-prune.timer
        enabled: true
        state: started

# The script and the service stay, hand-runnable; only the timer goes.
- name: Check for the image prune timer
  ansible.builtin.stat:
    path: /etc/systemd/system/docker-image-prune.timer
  register: docker_image_prune_timer
  when: not docker_image_prune

- name: Stop the image prune timer
  ansible.builtin.systemd_service:
    name: docker-image-prune.timer
    enabled: false
    state: stopped
  when: not docker_image_prune and docker_image_prune_timer.stat.exists

- name: Add the deploy user to the docker group
  ansible.builtin.user:
    name: "{{ plexus_deploy_user }}"
    groups: docker
    append: true
  when: plexus_deploy_user is defined
