name: _publish-package

# The package shape of `publish` (§ 5 PLX-Delivery): from checked code on
# the trunk, version and publish with changesets. On a push with
# pending changesets it opens or updates the "version packages" PR; on the
# push that merges that PR it publishes. To npm that is token-less through
# OIDC trusted publishing, with provenance; to the forge's package registry,
# where a tenant keeps its private packages, with the job's own token. The
# caller runs this after _check.yml in the same run; the verb does not check
# again.
#
# With `snapshot`, nothing is versioned on the trunk: the pending changesets
# of the branch the run was started on are published as snapshot versions
# under that dist-tag, for a consumer to install before the release.

on:
  workflow_call:
    inputs:
      strategy:
        description: >-
          Where the job runs (§ 8 PLX-Delivery): `github`, the forge's runners;
          `on-prem` or `hybrid`, a small slot of the tenant's runner host.
        required: false
        type: string
        default: github
      registry:
        description: >-
          Where the packages are published (§ 5 PLX-Delivery): `npm`, the public
          registry; `github`, the forge's package registry, private to the tenant.
        required: false
        type: string
        default: npm
      snapshot:
        description: >-
          A dist-tag: publish the pending changesets as snapshot versions under
          it instead of versioning and releasing. Empty for a release.
        required: false
        type: string
        default: ''

# No permissions of its own: the job has what its caller grants. A release
# needs `contents: write` (the version PR and the tags) and `pull-requests:
# write` (the "version packages" PR); then `id-token: write` for npm (the
# build provenance) or `packages: write` for the forge's registry.

jobs:
  publish:
    runs-on: ${{ inputs.strategy == 'github' && 'ubuntu-latest' || 'ci-small' }}
    concurrency: publish
    # mise install runs the postinstall hook, which points core.hooksPath at
    # hk, so hk's hooks would fire on anything changesets/action commits or
    # pushes through the git CLI. Wrong in both directions: pre-push cannot
    # resolve the tag objects `changeset publish` creates, and re-running
    # the checks here only repeats what the check job already ran.
    env:
      HK_SKIP_HOOK: pre-commit,pre-push
    steps:
      - uses: actions/checkout@v7
      # The forge's package registry takes the job's own token, in a user-level
      # npmrc of the job's own; each package names the registry in its
      # `publishConfig`. npm needs nothing here: it trusts the workflow.
      #
      # `publishConfig` steers the publish alone. Before it, `changeset publish`
      # asks `pnpm info <name>` which versions exist, and pnpm answers from the
      # registry of the package's scope: npm, unless the scope is mapped. There
      # a private package is a 404, so every version counts as unpublished and
      # is published again, which the forge refuses with a 409. Hence the scope
      # line; the scope is the repo's owner in lower case, as that registry
      # requires.
      - name: Log in to the forge's package registry
        if: ${{ inputs.registry == 'github' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          scope=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          {
            printf '//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN"
            printf '@%s:registry=https://npm.pkg.github.com\n' "$scope"
          } > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      # Build every package in dependency order before publishing: `changeset
      # publish` runs the packages' `prepack` hooks alphabetically, so a
      # package compiled against a workspace sibling's types would otherwise
      # find no dist to resolve them from.
      - run: pnpm exec turbo run build
      # v2 is the one that understands @changesets/cli 3: v1 found the published
      # packages by parsing the `New tag:` lines the 2.x CLI printed, which 3.x
      # no longer does, so 3.x publishes reached npm with no tag and no GitHub
      # release. v2 reads the CLI's structured output, pushes a tag per
      # published package and creates its release (both on by default), through
      # the GitHub API, so the version commit and the tags are signed. The
      # action publishes no moving `v2` tag, so the pin is exact and the update
      # bot carries it; our scripts call the CLI directly, so the
      # CHANGESETS_OUTPUT the action hands them reaches it unchanged.
      - uses: changesets/action@v2.1.2
        if: ${{ inputs.snapshot == '' }}
        with:
          version-script: pnpm exec changeset version
          publish-script: pnpm exec changeset publish
          commit-message: "chore: version packages"
          pr-title: "Version Packages"
      # A snapshot leaves the trunk alone: the versions it writes
      # (0.0.0-<tag>-<timestamp>) are published and never committed or tagged.
      - name: Publish snapshot versions
        if: ${{ inputs.snapshot != '' }}
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          pnpm exec changeset version --snapshot "$SNAPSHOT"
          pnpm exec changeset publish --tag "$SNAPSHOT" --no-git-tag
