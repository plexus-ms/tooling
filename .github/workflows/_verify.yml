name: _verify

# Mounts `verify` for an app repo (§§ 1, 2 and 8 PLX-Delivery): build every
# app's image and test it, for the whole repo and run. The tenant's on_pr.yml
# and on_push.yml run it after _check.yml, which gates it: a commit that
# fails the check builds and launches nothing. The logic is plx-ci's
# (@plexus-ms/cli-ci, pinned in the caller's mise.toml); every step here is
# one invocation.
#
#   plan             small   the build and test hashes from one Turbo dry run, the look-ups,
#                            the matrix; under hybrid, one instance per app that owes something
#   build-and-test   large   per app, on one machine: `build`, the image from the pruned
#                            context, pushed to the registry as build-<hash>; then `test`, the
#                            app's compose stack on the candidate, its tests, the tag test-<hash>
#   cleanup          small   hybrid only: delete what this run launched
#
# The large job carries two verbs because they want the same machine: a test
# starts when its own build ends, no second machine boots or idles meanwhile,
# and a failed build tests nothing. Which of the two a leg owes is the plan's:
# both, the test alone where the registry holds the build, or the build alone
# for an app without tests. The job's name is fixed, `build, test`, whatever a
# leg owes; the plan's log and the steps that run say which.
#
# Where a job of a size runs is the strategy's (`strategy`): the forge's
# runners, the slots of the tenant's runner hosts, or, for a large job under
# hybrid, an instance of its own. Where the candidates live is `registry`:
# the pair on the tenant's object storage, or the forge's registry.
#
# A decision comes from a content hash, never from a diff: the same inputs
# are built once and tested once, and a run whose hashes all hit has no
# large job at all.
#
# The caller's secrets are one: the vault's service account token.
# Everything else is read from the vault `<owner>-ci` (§ 3 PLX-Secrets): the
# apps' build-time keys always; the object-storage keys with a registry of
# the tenant's own; the cloud keys, the relay and the GitHub App under
# hybrid; the App also where the run plans a deploy, to read the operations
# repo's inventory.

on:
  workflow_call:
    inputs:
      strategy:
        description: >-
          Where the jobs run (§ 8 PLX-Delivery): `github`, the forge's runners;
          `on-prem`, the slots of the tenant's runner hosts (actions_runners)
          for every size; `hybrid`, slots for the small and medium jobs and a
          throwaway cloud instance for each large one.
        required: false
        type: string
        default: github
      registry:
        description: "Where the candidates live: `ghcr`, the forge's registry, beside the published images; `own`, the registry pair on the tenant's object storage."
        required: false
        type: string
        default: ghcr
      deploy:
        description: Plan the deploys too, for the release that follows on an environment branch; a pull request deploys nowhere.
        required: false
        type: boolean
        default: false
      environment:
        description: >-
          With `deploy`: the environment the run releases into. Empty derives
          it from the branch (main → production, develop → staging, else
          none), which is the rule; a caller sets it only to stand in for an
          environment branch.
        required: false
        type: string
        default: ''
      image-prefix:
        description: Where published images go, `<registry>/<owner>`; the image is `<prefix>/<app>:<sha>`. Default ghcr.io/<owner>.
        required: false
        type: string
        default: ''
      vault:
        description: The vault CI reads (§ 3 PLX-Secrets). Default <owner>-ci.
        required: false
        type: string
        default: ''
      operations-repo:
        description: With `deploy`, the tenant's operations repo whose inventory holds the deploy targets (PLX-Environment), by its name in the owner's org; PLX-Tenancy names it `operations`.
        required: false
        type: string
        default: operations
      alerts-email:
        description: Hybrid, the address mailed when an instance misses its boot and is kept; empty for no mail. A template answer, never a vault item (§ 3 PLX-Secrets).
        required: false
        type: string
        default: ''
      instance-type:
        description: Hybrid, the type of the instances; empty for plx-ci's default.
        required: false
        type: string
        default: ''
      private-packages:
        description: >-
          The repo installs private packages of the tenant's from the forge's
          package registry (§ 5 PLX-Delivery): the job logs in to it with its
          own token, which needs `packages: read` from the caller.
        required: false
        type: boolean
        default: false
      tooling-ref:
        description: >-
          A trial of unreleased tooling: plx-ci and plx are built from a
          checkout of plexus-ms/tooling at this ref instead of the caller's
          pins. Empty for the pins.
        required: false
        type: string
        default: ''
    secrets:
      op-service-account-token:
        description: The vault's service account token, reading the vault `<owner>-ci`.
        required: true
    outputs:
      apps:
        description: Every app planned, with its hashes, JSON; what _release.yml publishes.
        value: ${{ jobs.plan.outputs.apps }}
      deploys:
        description: With `deploy`, the deploys of the release, JSON, for _release.yml; `[]` without an environment.
        value: ${{ jobs.plan.outputs.deploys }}
      environment:
        description: With `deploy`, the environment the run releases into; empty for none.
        value: ${{ jobs.plan.outputs.environment }}

permissions:
  contents: read
  packages: write
  actions: read

env:
  EXO_VERSION: 1.103.2
  CRANE_VERSION: 0.22.1
  CI_STRATEGY: ${{ inputs.strategy }}
  CI_REGISTRY: ${{ inputs.registry }}
  MAIL_TO: ${{ inputs.alerts-email }}
  VAULT: ${{ inputs.vault || format('{0}-ci', github.repository_owner) }}
  IMAGE_PREFIX: ${{ inputs.image-prefix || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  plan:
    runs-on: ${{ inputs.strategy == 'github' && 'ubuntu-latest' || 'ci-small' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      apps: ${{ steps.plan.outputs.apps }}
      deploys: ${{ steps.plan.outputs.deploys }}
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      # How the job reads the vault (§ 8 PLX-Delivery): a slot of a runner host
      # carries its Connect server's address and token (actions_runners), and
      # every other runner gets the service account's. Never both: each read
      # would warn, and a slot's job has no use for the service account.
      - name: How the vault is read
        env:
          TOKEN: ${{ secrets.op-service-account-token }}
        run: |
          if [ -n "${OP_CONNECT_HOST:-}" ] && [ -n "${OP_CONNECT_TOKEN:-}" ]; then
            echo "Through the runner's Connect server."
          else
            echo "OP_SERVICE_ACCOUNT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "With the service account."
          fi
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.tooling-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          repository: plexus-ms/tooling
          ref: ${{ inputs.tooling-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased tooling
        if: ${{ inputs.tooling-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - run: plx-ci --version
      - name: Load the registry's keys from the vault
        if: ${{ inputs.registry == 'own' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          REGISTRY_ENDPOINT: op://${{ env.VAULT }}/bucket-registry/endpoint
          REGISTRY_REGION: op://${{ env.VAULT }}/bucket-registry/region
          REGISTRY_ACCESS_KEY: op://${{ env.VAULT }}/bucket-registry/access-key-id
          REGISTRY_SECRET_KEY: op://${{ env.VAULT }}/bucket-registry/secret-access-key
      - name: Load the App's key from the vault
        if: ${{ inputs.deploy || inputs.strategy == 'hybrid' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          APP_PRIVATE_KEY: op://${{ env.VAULT }}/github-app/private-key
          APP_CLIENT_ID: op://${{ env.VAULT }}/github-app/client-id
      - name: Load the cloud's keys and the relay from the vault
        if: ${{ inputs.strategy == 'hybrid' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          EXOSCALE_API_KEY: op://${{ env.VAULT }}/exoscale/ci-launch/key
          EXOSCALE_API_SECRET: op://${{ env.VAULT }}/exoscale/ci-launch/secret
          SELF_DELETE_KEY: op://${{ env.VAULT }}/exoscale/ci-selfdelete/key
          SELF_DELETE_SECRET: op://${{ env.VAULT }}/exoscale/ci-selfdelete/secret
          SMTP_HOST: op://${{ env.VAULT }}/smtp-relay/host
          SMTP_USER: op://${{ env.VAULT }}/smtp-relay/username
          SMTP_PASSWORD: op://${{ env.VAULT }}/smtp-relay/password
          MAIL_FROM: op://${{ env.VAULT }}/smtp-relay/from
      # The relay's port is no secret, and load-secrets masks every value it
      # loads: a 3-digit port turns up in a 16-digit content hash now and then,
      # and a job output that holds a masked string is dropped (GitHub: "Skip
      # output ... since it may contain secret"), so the plan's `matrix` and
      # `apps` would vanish and nothing would build. `op` is on the path from
      # the step above; what it reads here is registered as no secret.
      - name: Read the relay's port from the vault
        if: ${{ inputs.strategy == 'hybrid' }}
        run: echo "SMTP_PORT=$(op read "op://${VAULT}/smtp-relay/port")" >> "$GITHUB_ENV"
      # Into the job's home, not /usr/local: a small or medium slot of a runner
      # host (actions_runners) runs with no-new-privileges, so sudo is no option.
      - name: Install exo
        if: ${{ inputs.strategy == 'hybrid' }}
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/exoscale/cli/releases/download/v${EXO_VERSION}/exoscale-cli_${EXO_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" exo
      # Into the job's home, not /usr/local: a small or medium slot of a runner
      # host (actions_runners) runs with no-new-privileges, so sudo is no option.
      - name: Install crane
        if: ${{ inputs.registry == 'ghcr' }}
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C "$HOME/.local/bin" crane
      - name: Log in to the forge's registry
        if: ${{ inputs.registry == 'ghcr' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: The registry
        run: plx-ci registry
      # Where each app deploys is the operations repo's inventory
      # (PLX-Environment), checked out with the tenant's App.
      - name: A token that may read the operations repo
        id: operations
        if: ${{ inputs.deploy }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.operations-repo }}
          permission-contents: read
      - uses: actions/checkout@v7
        if: ${{ inputs.deploy }}
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.operations-repo }}
          token: ${{ steps.operations.outputs.token }}
          path: operations
      - name: Plan
        id: plan
        env:
          DEPLOY: ${{ inputs.deploy && 'yes' || '' }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: plx-ci plan --test ${DEPLOY:+--deploy --environment "$ENVIRONMENT" --inventory operations/inventory}
      # Hybrid: one instance per leg, created at once, each waited for until
      # its runner is online. One that misses is kept, stopped and mailed
      # about, and replaced once.
      - name: A token that may register and remove runners on this repo
        id: runners
        if: ${{ inputs.strategy == 'hybrid' && steps.plan.outputs.matrix != '[]' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
      - name: Create the instances
        if: ${{ inputs.strategy == 'hybrid' && steps.plan.outputs.matrix != '[]' }}
        env:
          RUNNER_TOKEN: ${{ steps.runners.outputs.token }}
          MATRIX: ${{ steps.plan.outputs.matrix }}
          INSTANCE_TYPE: ${{ inputs.instance-type }}
          # Minutes after boot, each a timer the user-data arms (userData.ts).
          NO_JOB_MINUTES: 10 # no job started by then: the instance deletes itself, no mail
          DEATH_MINUTES: 45 # a few minutes past build-and-test's timeout-minutes: a mail, then self-delete
          POWEROFF_MINUTES: 50 # the last resort after the death deadline: power-off, the sweep removes it
        run: plx-ci hybrid create-instances "$MATRIX"

  # One job per leg of the plan, an app that owes something, and one machine
  # for it: the build where `matrix.build` says so, then the test where
  # `matrix.test` carries its hash. A build that fails ends the job, so its
  # test never starts; the other apps' legs run on (fail-fast off). The name
  # is fixed: the forge does not evaluate `matrix` for a job it skips, and
  # most runs owe nothing. What a leg owes is in the plan's log and its steps.
  build-and-test:
    name: build, test
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      # How the job reads the vault (§ 8 PLX-Delivery): a slot of a runner host
      # carries its Connect server's address and token (actions_runners), and
      # every other runner gets the service account's. Never both: each read
      # would warn, and a slot's job has no use for the service account.
      - name: How the vault is read
        env:
          TOKEN: ${{ secrets.op-service-account-token }}
        run: |
          if [ -n "${OP_CONNECT_HOST:-}" ] && [ -n "${OP_CONNECT_TOKEN:-}" ]; then
            echo "Through the runner's Connect server."
          else
            echo "OP_SERVICE_ACCOUNT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "With the service account."
          fi
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.tooling-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          repository: plexus-ms/tooling
          ref: ${{ inputs.tooling-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased tooling
        if: ${{ inputs.tooling-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      # A step output, not the job's environment: the key is the build's, and
      # the test that follows on this machine has no business with it.
      - name: The app's fixed Next key
        id: key
        if: ${{ matrix.build }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: op://${{ env.VAULT }}/app_${{ matrix.app }}/server-actions-key
      - name: Load the registry's keys from the vault
        if: ${{ inputs.registry == 'own' && inputs.strategy != 'hybrid' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          REGISTRY_ENDPOINT: op://${{ env.VAULT }}/bucket-registry/endpoint
          REGISTRY_REGION: op://${{ env.VAULT }}/bucket-registry/region
          REGISTRY_ACCESS_KEY: op://${{ env.VAULT }}/bucket-registry/access-key-id
          REGISTRY_SECRET_KEY: op://${{ env.VAULT }}/bucket-registry/secret-access-key
      # plx-ci test finds the candidate with crane, which reads the login
      # docker writes below; into the job's home, as in plan.
      - name: Install crane
        if: ${{ inputs.registry == 'ghcr' && matrix.test != '' }}
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C "$HOME/.local/bin" crane
      - name: Log in to the forge's registry
        if: ${{ inputs.registry == 'ghcr' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The tenant's private packages (§ 5 PLX-Delivery), for the test's install
      # and, as a BuildKit secret, for the image's (plx-ci build): the job's own token
      # in a user-level npmrc of the job's own, which pnpm and npm read beside
      # the scope's registry in pnpm-workspace.yaml. The repo holds no token,
      # and the package grants this repo's workflows read access on the forge.
      - name: Log in to the forge's package registry
        if: ${{ inputs.private-packages }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"
      - name: The registry
        run: plx-ci registry
      # The specs and their dependencies, the app's own; Chromium's headless
      # shell, which is all a headless spec launches, with its system libraries
      # at the Playwright version the lockfile pins. Started here in the
      # background, so that it runs beside the build, and awaited below.
      - name: Start installing the app's dependencies and the browser
        if: ${{ matrix.test != '' }}
        run: |
          {
            set +e
            (
              set -e
              corepack enable
              pnpm install --frozen-lockfile --filter "{./apps/${{ matrix.app }}}..."
              pnpm --filter "./apps/${{ matrix.app }}" exec playwright install --with-deps --only-shell chromium
            )
            echo $? > "$RUNNER_TEMP/install.exit"
          } > "$RUNNER_TEMP/install.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/install.pid"
      - name: Build
        if: ${{ matrix.build }}
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ steps.key.outputs.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: plx-ci build "${{ matrix.app }}" "${{ matrix.hash }}" "$GITHUB_SHA"
      # The install's log, to its end, and its outcome; an install that died
      # without one has failed.
      - name: Install the app's dependencies and the browser
        if: ${{ matrix.test != '' }}
        run: |
          tail --pid="$(cat "$RUNNER_TEMP/install.pid")" -n +1 -f "$RUNNER_TEMP/install.log"
          exit "$(cat "$RUNNER_TEMP/install.exit" 2>/dev/null || echo 1)"
      - name: Test
        if: ${{ matrix.test != '' }}
        run: plx-ci test "${{ matrix.app }}" "${{ matrix.hash }}" "${{ matrix.test }}"

  # Hybrid: delete what this run launched, whatever the jobs ended in: an
  # instance a failed job left, or a runner that never took one. Skipped
  # where plan succeeded and launched nothing (one instance per entry of
  # the matrix, so an empty one is none); a plan that failed or was
  # cancelled may have launched part, and is cleaned up after. It never
  # fails the run: what it leaves, the instances' own deadlines and the
  # daily housekeeping remove.
  cleanup:
    needs: [plan, build-and-test]
    if: >-
      ${{ always() && inputs.strategy == 'hybrid' && needs.plan.result != 'skipped'
          && !(needs.plan.result == 'success' && needs.plan.outputs.matrix == '[]') }}
    continue-on-error: true
    runs-on: ${{ inputs.strategy == 'github' && 'ubuntu-latest' || 'ci-small' }}
    steps:
      # How the job reads the vault (§ 8 PLX-Delivery): a slot of a runner host
      # carries its Connect server's address and token (actions_runners), and
      # every other runner gets the service account's. Never both: each read
      # would warn, and a slot's job has no use for the service account.
      - name: How the vault is read
        env:
          TOKEN: ${{ secrets.op-service-account-token }}
        run: |
          if [ -n "${OP_CONNECT_HOST:-}" ] && [ -n "${OP_CONNECT_TOKEN:-}" ]; then
            echo "Through the runner's Connect server."
          else
            echo "OP_SERVICE_ACCOUNT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "With the service account."
          fi
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.tooling-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          repository: plexus-ms/tooling
          ref: ${{ inputs.tooling-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased tooling
        if: ${{ inputs.tooling-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Load the cloud's key and the App's from the vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          EXOSCALE_API_KEY: op://${{ env.VAULT }}/exoscale/ci-launch/key
          EXOSCALE_API_SECRET: op://${{ env.VAULT }}/exoscale/ci-launch/secret
          APP_PRIVATE_KEY: op://${{ env.VAULT }}/github-app/private-key
          APP_CLIENT_ID: op://${{ env.VAULT }}/github-app/client-id
      - name: A token that may register and remove runners on this repo
        id: runners
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
      # Into the job's home, not /usr/local: a small or medium slot of a runner
      # host (actions_runners) runs with no-new-privileges, so sudo is no option.
      - name: Install exo
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/exoscale/cli/releases/download/v${EXO_VERSION}/exoscale-cli_${EXO_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" exo
      - name: Delete what this run launched
        env:
          RUNNER_TOKEN: ${{ steps.runners.outputs.token }}
        run: plx-ci hybrid destroy-instances
