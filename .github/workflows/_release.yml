name: _release

# Mounts `release` for an app repo (§§ 1, 2 and 8 PLX-Delivery): publish
# every app's tested image under its commit and deploy it into the run's
# environment. The tenant's on_push.yml runs it after _check.yml and
# _verify.yml on a push to an environment branch, and hands it what the
# verify planned: the apps, the environment, and where each app deploys.
#
#   publish              small   the tested manifest under its commit in the forge's registry
#   display-versions     small   what each app shows as its version, and the version production cuts
#   deploy               small   _deploy.yml per app with a target in the environment
#   tag-display-version  small   the cut version's tag and GitHub Release, once every deploy is green
#
# The two display-version jobs run only with the input `display-versions`;
# without it the release is publish and deploy and nothing else. A repo that
# turns it on states `major:` in its PLEXUS.md, grants this workflow
# `contents: write` (the tag and the Release), uses ${PLEXUS_DISPLAY_VERSION}
# in the compose files of the apps that show it, and serializes its release
# job (a concurrency group per ref that cancels nothing), so that two pushes
# to main never take the same number. plx-ci's display-versions states how
# the versions are read from the tags and the registry (PLX-Releases).
#
# Every deploy is handed the commit released, display versions or not: an
# app whose compose file uses ${PLEXUS_COMMIT_SHA} shows the commit it was
# started from, and one that does not is deployed as before.
#
# A promotion never builds: a commit whose images the registry holds is
# published from them and deployed. Without an environment (a run by hand on
# a branch that names none) nothing is released. A release once started runs
# to its end: the caller cancels a superseded check or verify, never this
# (§ 2 PLX-Delivery).

on:
  workflow_call:
    inputs:
      strategy:
        description: >-
          Where the jobs run (§ 8 PLX-Delivery): `github`, the forge's runners;
          `on-prem`, the slots of the tenant's runner hosts (actions_runners)
          for every size; `hybrid`, slots for the small and medium jobs and a
          throwaway cloud instance for each large one.
        required: false
        type: string
        default: github
      registry:
        description: "Where the candidates live: `ghcr`, the forge's registry, beside the published images; `own`, the registry pair on the tenant's object storage."
        required: false
        type: string
        default: ghcr
      overlay:
        description: "How a deploy reaches the hosts: `netbird`, over the tenant's overlay, which the job joins itself where its runner is not on it; `none`, as named."
        required: false
        type: string
        default: none
      apps:
        description: The apps to publish, with their hashes, JSON; _verify.yml's output `apps`.
        required: true
        type: string
      deploys:
        description: The deploys, JSON; _verify.yml's output `deploys`.
        required: true
        type: string
      environment:
        description: The environment released into; _verify.yml's output `environment`. Empty releases nothing.
        required: true
        type: string
      image-prefix:
        description: Where published images go, `<registry>/<owner>`; the image is `<prefix>/<app>:<sha>`. Default ghcr.io/<owner>.
        required: false
        type: string
        default: ''
      vault:
        description: The vault CI reads (§ 3 PLX-Secrets). Default <owner>-ci.
        required: false
        type: string
        default: ''
      dry-run:
        description: Deploy as `plx -n deploy`, printing the lines without reaching the host.
        required: false
        type: boolean
        default: false
      display-versions:
        description: >-
          Give every deployed app a display version, PLEXUS_DISPLAY_VERSION,
          and cut a version tag with a GitHub Release when a production release
          changes an app (PLX-Releases). Off: the release neither computes nor
          tags anything.
        required: false
        type: boolean
        default: false
      tooling-ref:
        description: >-
          A trial of unreleased tooling: plx-ci and plx are built from a
          checkout of plexus-ms/tooling at this ref instead of the caller's
          pins. Empty for the pins.
        required: false
        type: string
        default: ''
    secrets:
      op-service-account-token:
        description: The vault's service account token, reading the vault `<owner>-ci`.
        required: true

# Per job, not here: what the workflow declares at its top caps every job,
# and the one job that writes contents (tag-display-version) would otherwise
# need every caller to grant it, display versions or not. That job declares
# nothing and runs with what its caller grants.

env:
  CRANE_VERSION: 0.22.1
  CI_STRATEGY: ${{ inputs.strategy }}
  CI_REGISTRY: ${{ inputs.registry }}
  CI_OVERLAY: ${{ inputs.overlay }}
  VAULT: ${{ inputs.vault || format('{0}-ci', github.repository_owner) }}
  IMAGE_PREFIX: ${{ inputs.image-prefix || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  publish:
    if: ${{ inputs.environment != '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.apps) }}
    runs-on: ${{ inputs.strategy == 'github' && 'ubuntu-latest' || 'ci-small' }}
    steps:
      # How the job reads the vault (§ 8 PLX-Delivery): a slot of a runner host
      # carries its Connect server's address and token (actions_runners), and
      # every other runner gets the service account's. Never both: each read
      # would warn, and a slot's job has no use for the service account.
      - name: How the vault is read
        env:
          TOKEN: ${{ secrets.op-service-account-token }}
        run: |
          if [ -n "${OP_CONNECT_HOST:-}" ] && [ -n "${OP_CONNECT_TOKEN:-}" ]; then
            echo "Through the runner's Connect server."
          else
            echo "OP_SERVICE_ACCOUNT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "With the service account."
          fi
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.tooling-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          repository: plexus-ms/tooling
          ref: ${{ inputs.tooling-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased tooling
        if: ${{ inputs.tooling-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Load the registry's keys from the vault
        if: ${{ inputs.registry == 'own' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          REGISTRY_ENDPOINT: op://${{ env.VAULT }}/bucket-registry/endpoint
          REGISTRY_REGION: op://${{ env.VAULT }}/bucket-registry/region
          REGISTRY_ACCESS_KEY: op://${{ env.VAULT }}/bucket-registry/access-key-id
          REGISTRY_SECRET_KEY: op://${{ env.VAULT }}/bucket-registry/secret-access-key
      # Into the job's home, not /usr/local: a small or medium slot of a runner
      # host (actions_runners) runs with no-new-privileges, so sudo is no option.
      - name: Install crane
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C "$HOME/.local/bin" crane
      - name: Log in to the forge's registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: The registry
        run: plx-ci registry
      - name: Publish
        env:
          TEST: ${{ matrix.test }}
        run: plx-ci publish "${{ matrix.app }}" "${{ matrix.hash }}" "$GITHUB_SHA" ${TEST:+--test "$TEST"}

  # One deploy per app with a target in the environment; an app without a
  # record there has no deployment there, which the plan said. The nested
  # workflow is named with the version ref, never as ./…: a tenant calls this
  # file at a version tag, which is annotated, and the forge resolves a relative
  # nested call to the tag object rather than its commit and fails to start
  # the run. The version's bookkeeping moves the ref with every other.
  display-versions:
    needs: publish
    if: ${{ inputs.display-versions && inputs.environment != '' && inputs.deploys != '[]' }}
    permissions:
      contents: read
      packages: read
    runs-on: ${{ inputs.strategy == 'github' && 'ubuntu-latest' || 'ci-small' }}
    outputs:
      version: ${{ steps.versions.outputs.version }}
      display-versions: ${{ steps.versions.outputs.display-versions }}
    steps:
      # The whole history with its tags: the versions are read from them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        if: ${{ inputs.tooling-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          repository: plexus-ms/tooling
          ref: ${{ inputs.tooling-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased tooling
        if: ${{ inputs.tooling-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Install crane
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C "$HOME/.local/bin" crane
      - name: Log in to the forge's registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Display versions
        id: versions
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYS: ${{ inputs.deploys }}
        run: plx-ci display-versions "$ENVIRONMENT" "$GITHUB_SHA" --deploys "$DEPLOYS"

  deploy:
    needs: [publish, display-versions]
    # As before when display versions are off, their job then skipped: every
    # publish green, and something to deploy.
    if: ${{ !cancelled() && needs.publish.result == 'success' && (needs.display-versions.result == 'success' || needs.display-versions.result == 'skipped') && inputs.deploys != '[]' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.deploys) }}
    uses: plexus-ms/tooling/.github/workflows/_deploy.yml@0.130.0
    with:
      strategy: ${{ inputs.strategy }}
      app: ${{ matrix.app }}
      image-ref: ${{ matrix.image }}
      host: ${{ matrix.host }}
      environment: ${{ inputs.environment }}
      overlay: ${{ inputs.overlay }}
      vault: ${{ inputs.vault }}
      dry-run: ${{ inputs.dry-run }}
      display-version: ${{ fromJSON(needs.display-versions.outputs.display-versions || '{}')[matrix.app] || '' }}
      commit-sha: ${{ github.sha }}
      tooling-ref: ${{ inputs.tooling-ref }}
    secrets:
      op-service-account-token: ${{ secrets.op-service-account-token }}

  # The version names a state of production that happened: only once every
  # deploy of the release is green, and only when it cut one. A re-run of the
  # failed deploys gets here with the same number.
  tag-display-version:
    needs: [display-versions, deploy]
    if: ${{ !cancelled() && inputs.environment == 'production' && !inputs.dry-run && needs.display-versions.outputs.version != '' && needs.deploy.result == 'success' }}
    runs-on: ${{ inputs.strategy == 'github' && 'ubuntu-latest' || 'ci-small' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        if: ${{ inputs.tooling-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          repository: plexus-ms/tooling
          ref: ${{ inputs.tooling-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.tooling-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased tooling
        if: ${{ inputs.tooling-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Tag the version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.display-versions.outputs.version }}
        run: plx-ci tag-display-version "$VERSION" "$GITHUB_SHA"
